function tone(f0, f1, dur, vol, type = 'sine', delay = 0) {

function resize() { VW = innerWidth; VH = innerHeight; renderer.setSize(VW, VH, false); fitCam(); }
function toScreen(x, y, z = 0) { const p = V3(x, y, z).project(camera); return { x: (p.x + 1) / 2 * VW, y: (1 - p.y) / 2 * VH }; }

/* ===================== ゲームの流れ ===================== */
let mode = 'title', cur = 0, G = null, hold = false, acc = 0, msgT = 0, lastSplat = 0, prevContacts = 0, clearAt = 0;
const PROG = () => lsGet('kj_prog') || { open: 1, best: {} };
function saveBest(i, ms) { const p = PROG(); if (!p.best[i] || ms < p.best[i]) p.best[i] = ms; p.open = Math.max(p.open, Math.min(30, i + 2)); lsSet('kj_prog', p); }
const showPanel = id => ['#title', '#selectP', '#clearP'].forEach(p => $(p).hidden = p !== id);
function bigMsg(t, sub = '', cls = '', dur = 1.2) { $('#msgBig').textContent = t; $('#msgBig').className = cls; $('#msgSub').textContent = sub; $('#msg').hidden = !t; msgT = dur; }
const fmt = ms => (ms / 1000).toFixed(2);
let tapLock = 0;
const guard = fn => (...a) => { const n = performance.now(); if (n < tapLock) return; tapLock = n + 350; audioOn(); SND.click(); fn(...a); };

function startStage(i) {
  cur = clamp(i, 0, STAGES.length - 1); mode = 'play'; hold = false; acc = 0;
  G = SIM.newGame(STAGES[cur]); jelly.reset(); buildStage(STAGES[cur]); fitCam();
  showPanel(null); $('#hud').hidden = false; $('#hint').hidden = false; prevContacts = 0;
  $('#stName').textContent = stName(cur); $('#stNo').textContent = tr('stageN', { n: cur + 1 });
  updHud(); chop.userData.t = 0;
  const ghost = STAGES[cur].objs.some(o => o.vis === 'ghost');
  bigMsg(String(cur + 1), stName(cur) + (ghost ? ' ・ ' + tr('ghost') : cur === 0 ? ' ・ ' + tr('still') : ''), 'good', cur === 0 ? 2.4 : 1.4);
}
function updHud() { $('#tNow').textContent = fmt(G ? G.t * 1000 : 0); $('#tFail').textContent = tr('fails', { n: G ? G.fails : 0 }); }
function toTitle() { mode = 'title'; G = null; $('#upMark').hidden = true; $('#hud').hidden = true; $('#hint').hidden = true; $('#stillRing').hidden = true; showPanel('#title'); }
function openSelect() {
  mode = 'select'; $('#upMark').hidden = true; $('#hud').hidden = true; $('#hint').hidden = true; $('#stillRing').hidden = true; showPanel('#selectP');
  const p = PROG(), grid = $('#grid'); grid.innerHTML = '';
  for (let i = 0; i < STAGES.length; i++) {
    const b = document.createElement('button'), open = i < p.open, best = p.best[i];
    b.className = best ? 'done' : open ? '' : 'lock';
    b.innerHTML = `<b>${i + 1}</b><small>${best ? fmt(best) : open ? '' : esc(tr('locked'))}</small>`;
    b.setAttribute('aria-label', `${i + 1} ${stName(i)}`);
    if (open) b.onclick = guard(() => startStage(i)); else b.disabled = true;
    grid.appendChild(b);
  }
}
$('#goPlay').onclick = guard(() => { const p = PROG(); startStage(Math.min(p.open - 1, 29)); });
$('#goSelect').onclick = guard(openSelect);
$('#selBack').onclick = guard(toTitle);
$('#backBtn').onclick = guard(openSelect);
$('#clMenu').onclick = guard(openSelect);
$('#clRetry').onclick = guard(() => startStage(cur));
$('#clNext').onclick = guard(() => { if (cur < 29) startStage(cur + 1); else openSelect(); });

// 入力：画面のどこでも押す・はなす（ボタン以外）
canvas.addEventListener('pointerdown', e => { if (mode !== 'play') return; audioOn(); hold = true; try { canvas.setPointerCapture(e.pointerId); } catch (_) { } });
const up = () => { if (mode === 'play' && hold) { hold = false; } };
canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
addEventListener('keydown', e => { if (e.code === 'Space' && mode === 'play') { hold = true; e.preventDefault(); } });
addEventListener('keyup', e => { if (e.code === 'Space') up(); });
document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });
let lastTouchEnd = 0;
document.addEventListener('touchend', e => { const n = Date.now(); if (n - lastTouchEnd < 350 && !e.target.closest('input')) e.preventDefault(); lastTouchEnd = n; }, { passive: false });
['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));

function onClear() {
  mode = 'clear'; const ms = Math.round(G.t * 1000), f = G.fails; clearAt = performance.now();
  SND.clear(); buzz([30, 40, 60]); flash();
  bigMsg(tr('landed'), '', 'good', 1.6);
  const p = PROG(), prevBest = p.best[cur]; saveBest(cur, ms);
  last = { st: cur, ms, f, best: !prevBest || ms < prevBest };
  setTimeout(() => {
    if (mode !== 'clear') return;
    $('#hud').hidden = true; $('#hint').hidden = true; $('#stillRing').hidden = true; $('#upMark').hidden = true;
    $('#clName').textContent = `${cur + 1}. ${stName(cur)}`; $('#clTime').innerHTML = `${fmt(ms)}<small>${esc(tr('sec'))}</small>`;
    $('#clSub').textContent = tr('clSub', { f }) + (cur === 29 ? ' ・ ' + tr('allClear') : '');
    $('#nameIn').value = lsGet('kj_name') || ''; $('#send').disabled = false; $('#sendMsg').textContent = ''; $('#sendMsg').className = 'note';
    $('#clNext').textContent = cur < 29 ? tr('next') : tr('menu');
    showPanel('#clearP'); loadRank(cur);
  }, 1400);
}
function flash() { const f = $('#flash'); f.style.transition = 'none'; f.style.opacity = .7; requestAnimationFrame(() => { f.style.transition = ''; f.style.opacity = 0; }); }
let last = null;
$('#clShare').onclick = () => {
  if (!last) return;
  const url = GAME_URL + '?st=' + (last.st + 1);
  const text = tr('shareT', { name: stName(last.st), t: fmt(last.ms), n: last.st + 1 }) + '\n' + tr('tags') + '\n' + url;
  open('https://x.com/intent/post?text=' + encodeURIComponent(text), '_blank', 'noopener');
};

/* ===================== ランキング（面ごと） ===================== */
const FB = { apiKey: 'AIzaSyCMwGPHPKsDByV07QPq56-PGXTDxcYVNfc', databaseURL: 'https://furoya-no-onna-default-rtdb.asia-southeast1.firebasedatabase.app' };
async function fbAuth() {
  let a = lsGet('kj_auth'); if (a && a.exp > Date.now() + 60000) return a;
  if (a && a.refresh) {
    try { const r = await fetch('https://securetoken.googleapis.com/v1/token?key=' + FB.apiKey, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: 'grant_type=refresh_token&refresh_token=' + encodeURIComponent(a.refresh) });
      if (r.ok) { const j = await r.json(); a = { uid: j.user_id, token: j.id_token, refresh: j.refresh_token, exp: Date.now() + (+j.expires_in) * 1000 }; lsSet('kj_auth', a); return a; } } catch (_) { }
  }
  const r = await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=' + FB.apiKey, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ returnSecureToken: true }) });
  if (!r.ok) throw new Error('auth'); const j = await r.json(); a = { uid: j.localId, token: j.idToken, refresh: j.refreshToken, exp: Date.now() + (+j.expiresIn) * 1000 }; lsSet('kj_auth', a); return a;
}
async function fbGet(path, q) { const r = await fetch(FB.databaseURL + '/' + path + '.json' + (q || '')); if (!r.ok) throw new Error('get'); return r.json(); }
async function fbPut(path, val, a) { const r = await fetch(FB.databaseURL + '/' + path + '.json?auth=' + encodeURIComponent(a.token), { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(val) }); if (!r.ok) throw new Error('put ' + r.status); return r.json(); }
async function loadRank(i) {
  const ol = $('#rlist'); ol.innerHTML = `<li class="rempty">${esc(tr('rLoading'))}</li>`;
  try {
    const [d, hd] = await Promise.all([fbGet('konnyaku/st/' + (i + 1), '?orderBy=%22s%22&limitToFirst=60'), fbGet('konnyaku/hidden').catch(() => null)]);
    const me = (lsGet('kj_auth') || {}).uid;
    const list = Object.entries(d || {}).filter(([u, v]) => !(hd && hd[u]) && v && typeof v.s === 'number').map(([u, v]) => ({ u, ...v })).sort((a, b) => a.s - b.s || a.t - b.t).slice(0, 50);
    if (!list.length) { ol.innerHTML = `<li class="rempty">${esc(tr('rEmpty'))}</li>`; return; }
    ol.innerHTML = list.map((e, k) => `<li class="${e.u === me ? 'me' : ''}"><span class="no">${k + 1}</span><span class="nm">${esc(e.n)}</span><span class="sc">${fmt(e.s)}</span></li>`).join('');
  } catch (e) { ol.innerHTML = `<li class="rempty">${esc(tr('rFail'))}</li>`; }
}
const NG = ['ちんこ', 'ちんぽ', 'まんこ', 'せっくす', 'セックス', 'きんたま', 'レイプ', '死ね', 'しね', '殺す', 'ころす', 'ガイジ', 'キチガイ', 'きちがい', 'ニガー', 'チョン', '支那', 'fuck', 'shit', 'bitch', 'cunt', 'dick', 'pussy', 'nigger', 'nigga', 'faggot', 'retard', 'whore', 'slut', 'rape', 'porn', 'nazi', 'hitler', '씨발', '시발', '병신', '좆', '肏', '屄', '屌', '幹你', '操你', '婊子'];
const badName = s => { const n = s.normalize('NFKC').toLowerCase().replace(/[\s・._\-ー〜~!！?？*＊]/g, ''); return NG.some(w => n.includes(w.normalize('NFKC').toLowerCase())); };
$('#send').onclick = async () => {
  const name = $('#nameIn').value.trim().replace(/\s+/g, ' ').slice(0, 12), msg = $('#sendMsg');
  msg.className = 'note';
  if (!name) { msg.textContent = tr('needName'); msg.className = 'note err'; return; }
  if (badName(name)) { msg.textContent = tr('badName'); msg.className = 'note err'; return; }
  if (!last) return;
  $('#send').disabled = true; msg.textContent = tr('sending'); lsSet('kj_name', name);
  try {
    const a = await fbAuth(), path = 'konnyaku/st/' + (last.st + 1) + '/' + a.uid;
    const mine = await fbGet(path).catch(() => null);
    if (mine && mine.s <= last.ms) { msg.textContent = tr('notBest'); loadRank(last.st); return; }
    await fbPut(path, { n: name, s: last.ms, f: Math.min(9999, last.f), t: { '.sv': 'timestamp' }, v: 1 }, a);
    msg.textContent = tr('sent'); loadRank(last.st);
  } catch (e) { $('#send').disabled = false; msg.className = 'note err'; msg.textContent = tr('sendFail'); }
};

/* ===================== まわす ===================== */
let lastT = performance.now(), tAll = 0;
const _v = new THREE.Vector3();
let MANUAL = false;
function frame(now) {
  const dt = Math.min(.1, (now - lastT) / 1000); lastT = now;
  if (!MANUAL) stepAll(dt);
  requestAnimationFrame(frame);
}
function stepAll(dt, draw = true) {
  tAll += dt;
  if (msgT > 0) { msgT -= dt; if (msgT <= 0) $('#msg').hidden = true; }
  if (mode === 'play' && G) {
    acc += dt; let n = 0;
    while (acc >= SIM.DT - 1e-9 && n < 24) {
      const wasMode = G.pan.mode;
      const r = SIM.stepGame(G, hold); acc -= SIM.DT; n++; jelly.step(G, r);
      if (wasMode === 'wind' && G.pan.mode === 'up') { SND.flip(G.pan.lastPower || 0); buzz(15); }
      if (r === 'fail') { SND.plop(); buzz([20, 30, 20]); bigMsg(tr('plop'), tr('plopSub'), 'bad', 1.0); chop.userData.t = 0; }
      if (r === 'clear') { onClear(); break; }
      // 着地した瞬間の音
      const c = G.contacts + (G.onPan ? 1 : 0);
      if (c > 0 && prevContacts === 0 && G.t - lastSplat > .25 && G.vmax > 1) { SND.splat(); lastSplat = G.t; }
      prevContacts = c;
    }
    if (acc > SIM.DT * 4) acc = 0;
    updHud();
    $('#hint').classList.toggle('hold', hold);
    $('#hintT').textContent = hold ? tr('hintHold') : tr('hintIdle');
    $('#hint').hidden = G.pan.mode === 'up';
  }
  // こんにゃく・道具・物を動かす
  if (G) {
    kon.update(G.k.P); kon.m.visible = true;
    const pp = SIM.panPose(G.pan.ang); panG.position.set(pp.x, pp.y, 0); panG.rotation.z = pp.a;
    $('#gFill').style.width = ((G.pan.mode === 'wind' ? G.pan.power : 0) * 100).toFixed(1) + '%';
    objMeshes.forEach(({ g }, i) => { const ps = G.objs[i].pose; g.position.set(ps.x, ps.y, 0); g.rotation.z = ps.a; });
    // 箸：はじめの1秒だけ上に見せて、開く
    chop.userData.t = (chop.userData.t || 0) + dt; const ct = chop.userData.t;
    chop.visible = ct < 1.4; chop.position.set(SIM.PAN.x - .2, SIM.PAN.y + 2.7 + Math.max(0, ct - .5) * 3, .4);
    const open = Math.min(1, ct * 3); chop.userData[-1].rotation.z = -.05 - open * .25; chop.userData[1].rotation.z = .05 + open * .25;
    // 2秒の輪
    if (mode === 'play' && G.still > .05) { const s = toScreen(G.cx, G.cy + 1.0); const r = $('#stillRing'); r.hidden = false; r.style.left = s.x + 'px'; r.style.top = s.y + 'px'; r.style.setProperty('--p', Math.min(1, G.still / SIM.STILL_NEED).toFixed(3)); }
    else if (mode === 'play') $('#stillRing').hidden = true;
    { const s = toScreen(G.cx, G.cy), um = $('#upMark'), off = mode === 'play' && s.y < 70; um.hidden = !off; if (off) um.style.left = clamp(s.x, 20, VW - 20) + 'px'; }
  } else kon.m.visible = false;
  // 風の線
  for (const grp of windFx) { const w = grp.userData.w, L = Math.hypot(w.fx, w.fy) || 1; grp.children.forEach(l => { l.userData.u = (l.userData.u + dt * .5) % 1; const u = w.fx >= 0 ? l.userData.u : 1 - l.userData.u; l.position.set(w.fx ? w.x0 + (w.x1 - w.x0) * u : w.x0 + (w.x1 - w.x0) * l.userData.v, w.fy ? Math.min(w.y1, 8) * u + w.y0 * (1 - u) : w.y0 + (Math.min(w.y1, 8) - w.y0) * l.userData.v, -.6); l.rotation.z = Math.atan2(w.fy, w.fx); l.material.opacity = .5 * Math.sin(u * Math.PI); }); }
  // 湯気
  for (const s of steam) { const u = ((tAll * .25 + s.userData.ph) % 1); s.position.set(s.userData.x + Math.sin(tAll + s.userData.ph) * .3, -2.1 + u * 1.6, .9); s.scale.setScalar(.4 + u * .9); s.material.opacity = .22 * (1 - u) * Math.min(1, u * 5); }
  if (draw) renderer.render(scene, camera);
}

/* ===================== 始める ===================== */
addEventListener('resize', resize);
resize(); applyLang();
$('#loading').remove();
const qst = parseInt(QS.get('st'), 10);
if (qst >= 1 && qst <= 30) startStage(qst - 1); else showPanel('#title');
requestAnimationFrame(frame);
window.__kj = { get G() { return G; }, get mode() { return mode; }, startStage, setHold(h) { hold = h; }, SIM, SND, STAGES, manual(v) { MANUAL = v; }, tick(dt, draw = true) { stepAll(dt, draw); }, run(n) { for (let i = 0; i < n; i++) stepAll(SIM.DT, i === n - 1); }, toScreen, camera };
</script>
